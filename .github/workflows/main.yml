name: Weather API docker k8s deployment

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}


jobs:
  lint:
    runs-on: ubuntu-22.04  # Use a compatible Ubuntu version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pylint
        run: pylint main.py


  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  
      - run: |
          sudo apt-get update && sudo apt-get install -y libfreetype6-dev
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - run: pytest tests/ --junitxml=junit/test-results.xml --cov=weather --cov-report=xml --cov-report=html

    

      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
    
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python # Set Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Install pip and pytest
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
      - name: Test with pytest
        run: pytest tests/ --doctest-modules --junitxml=junit/test-results-3.11.xml
      - name: Upload pytest test results
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-3.11
          path: junit/test-results-3.11.xml
        # Use always() to always run this step to publish test results when there are test failures
        if: ${{ always() }}

  config:
    runs-on: ubuntu-latest
    needs: build
    env:
      REGISTRY: docker.io
      REGISTRY_NAME: docker.io/${{ secrets.DOCKER_USERNAME }}/my-image-name
    steps:
      - uses: actions/checkout@v3

      - name: List files in current folder
        run: ls -alt

      - name: Log into Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}:latest .
          docker push ${{ env.REGISTRY_NAME }}:latest

  deploy:
    runs-on: ubuntu-latest
    needs: config
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Add SSH host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts
      - name: Set Environment Name
        run: echo "CI_ENVIRONMENT_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV

      - name: Deploy to Server (Dev Environment)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/
            ./${{ env.DEPLOY_SCRIPT }} \
              -v "latest" \
              -a "${{ env.CONTAINER_TAG }}"
              -u "${{ env.DOCKER_USERNAME }}" \
              -p "${{ secrets.DOCKER_TOKEN }}" \
              -l "/var/www/${{ env.DEPLOY_PATH }}" \
              -r "docker.io"
        env:
          CONTAINER_TAG: ${{ vars.CONTAINER_TAG }}
          REGISTRY_PATH: ${{ vars.REGISTRY_PATH }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          DEPLOY_SCRIPT: ${{ vars.DEPLOY_SCRIPT }}